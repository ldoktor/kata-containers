apiVersion: "local.storage.openshift.io/v1"
kind: "LocalVolume"
metadata:
  name: "local-disks"
  namespace: "openshift-local-storage"
spec:
  nodeSelector:
    nodeSelectorTerms:
    - matchExpressions:
      - key: kubernetes.io/hostname
        operator: In
        values:
        - HOSTNAME
  storageClassDevices:
  - storageClassName: "local-sc"
    forceWipeDevicesAndDestroyAllData: false
    volumeMode: Block
    devicePaths:
    - /dev/loop1
